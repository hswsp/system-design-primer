<nav class="top-nav">
    <button type="button" class="nav-toggle" aria-label="切换导航" onclick="gitbookToggleSummary()"><i class="fa fa-bars"></i></button>
    <a class="nav-brand" href="{{ site.baseurl }}/">{{ site.title | escape }}</a>
    <div class="nav-links">
        {% for label in site.ordered_collections %}
            {% assign col = site[label] %}
            {% if col.first %}
                <a href="{{ site.baseurl }}{{ col.first.url }}">{{ site.collection_titles[label] | default: label | escape }}</a>
            {% endif %}
        {% endfor %}
    </div>
</nav>
