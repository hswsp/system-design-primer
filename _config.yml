# Site settings
title: 系统设计入门
longtitle: 系统设计入门 - 中文版
author: hswsp
email:
description: >
  基于 system-design-primer 的系统设计入门中文书站。

version: 1.0
gitbook_version: 3.2.3
lang: zh-CN

url: 'https://hswsp.github.io'
baseurl: '/system-design-primer'

# Use jekyll-gitbook as remote theme
remote_theme: sighingnow/jekyll-gitbook

# Markdown
markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

collections:
  intro:
    output: true
  topics:
    output: true
  interviews:
    output: true
  oo:
    output: true
  resources:
    output: true

ordered_collections:
  - intro
  - topics
  - interviews
  - oo
  - resources

defaults:
  - scope:
      path: ""
    values:
      lang: zh-CN
  - scope:
      path: "_intro"
      type: intro
    values:
      layout: home
  - scope:
      path: "_topics"
      type: topics
    values:
      layout: home
  - scope:
      path: "_interviews"
      type: interviews
    values:
      layout: home
  - scope:
      path: "_oo"
      type: oo
    values:
      layout: home
  - scope:
      path: "_resources"
      type: resources
    values:
      layout: home

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jekyll-remote-theme
  - jemoji

exclude:
  - _drafts
  - docs
  - README.md
  - README-zh-Hans.md
  - README-zh-TW.md
  - README-ja.md
  - TRANSLATIONS.md
  - CONTRIBUTING.md
  - LICENSE.txt
  - .gitattributes
  - generate-epub.sh
  - epub-metadata.yaml
  - .superpowers

destination: ./_site
